/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 5
        filter_size_surf: 0.3
        filter_size_map: 0.3
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic: "/livox/points"
            imu_topic: "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 5
            scan_line: 4
            blind: 1.1
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            # Unity wheel/terrain contact produces acceleration impulses. Use
            # higher process noise so LiDAR corrections can reject them.
            acc_cov: 0.3
            gyr_cov: 0.3
            b_acc_cov: 0.001
            b_gyr_cov: 0.001
            fov_degree: 360.0
            det_range: 40.0
            extrinsic_est_en: false
            # Match the real MID-360: both streams use the same raw,
            # upside-down sensor axes and the factory internal extrinsic.
            extrinsic_T: [-0.011, -0.02329, 0.04412]
            extrinsic_R: [1., 0., 0.,
                          0., 1., 0.,
                          0., 0., 1.]

        publish:
            path_en: false
            effect_map_en: false
            map_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1
