request:
    pipeline_id: ompl
    group_name: kalman_arm
    num_planning_attempts: 10
    allowed_planning_time: 5.0
    max_velocity_scaling_factor: 0.7
    max_acceleration_scaling_factor: 0.7

    workspace_parameters:
        header:
            frame_id: arm_link
        min_corner: {x: -1.0, y: -1.0, z: -1.0}
        max_corner: {x: 1.0, y: 1.0, z: 1.0}

planning_options:
    plan_only: false
    look_around: false
    replan: false