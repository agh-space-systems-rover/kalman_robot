# CAN interface to use
can_interface: "can0"

# RX mappings (CAN to ROS)
rx_mappings:
  - can_id: 0xEA
    ros_topic: "/kutong/data"
    ros_type: "std_msgs/msg/UInt8MultiArray"
    max_rate: 2
    conversion:
      type: "direct"

  - can_id: 0xEB
    ros_topic: "/magneto/data"
    ros_type: "std_msgs/msg/UInt8MultiArray"
    max_rate: 5
    conversion:
      type: "direct"

# TX mappings (ROS to CAN)
  - can_id: 0xE4
    ros_topic: "/magneto/tare"
    ros_type: "std_msgs/msg/UInt8MultiArray"
    max_rate: 2
    conversion:
      type: "direct"

  - can_id: 0xE5
    ros_topic: "/magneto/request"
    ros_type: "std_msgs/msg/UInt8MultiArray"
    max_rate: 2
    conversion:
      type: "direct"

  - can_id: 0xE6
    ros_topic: "/kutong/request"
    ros_type: "std_msgs/msg/UInt8MultiArray"
    max_rate: 2
    conversion:
      type: "direct"
